<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe's Top Leagues – Club Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/europa-karte.css" />
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Europe's Top Leagues – Club Map</h1>
      <div class="sub">Stage 1: England · Spain · Germany · Italy · France · Portugal · Netherlands · Belgium · Sweden · Norway · Denmark · Finland</div>
    </div>
  </header>
  <div id="map-wrap">
    <div id="map"></div>
    <button id="fullscreen-btn" class="ctrl-btn" onclick="toggleFullscreen()">
      <span id="fs-icon">⤢</span> <span id="fs-label">Fullscreen</span>
    </button>

    <div id="filter-panel">
      <div id="filter-header" onclick="toggleFilter()">
        <span id="filter-title">Countries</span>
        <span id="filter-toggle">−</span>
      </div>
      <div id="filter-body"></div>
    </div>

    <div id="route-panel">
      <div id="route-header"><span id="route-title">Plan Route</span></div>
      <div id="route-hint">Open a popup → "+ Add to route".</div>
      <div id="route-stops"></div>
      <div id="route-summary"></div>
      <div id="route-actions">
        <button class="route-btn" id="clear-route-btn" onclick="clearRoute()" disabled>Clear</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script src="js/europa-karte.js"></script>
</body>
</html>
