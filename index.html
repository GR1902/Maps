<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday Explorer – Home Fixtures &amp; Scouting Routes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/spieltag-explorer.css" />
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Matchday Explorer</h1>
      <div class="sub">Home fixture locations &amp; combinable scouting routes</div>
    </div>
  </header>
  <div id="controls">
    <label for="league-select">League:</label>
    <select id="league-select" onchange="onLeagueChange()">
      <option value="epl">Premier League (ENG)</option>
      <option value="la_liga">La Liga (ESP)</option>
      <option value="bundesliga">Bundesliga (GER)</option>
      <option value="serie_a">Serie A (ITA)</option>
      <option value="ligue_1">Ligue 1 (FRA)</option>
      <option value="primeira_liga">Primeira Liga (POR)</option>
      <option value="eredivisie">Eredivisie (NED)</option>
      <option value="pro_league">Pro League (BEL)</option>
      <option value="allsvenskan">Allsvenskan (SWE)</option>
      <option value="eliteserien">Eliteserien (NOR)</option>
      <option value="superliga">Superliga (DEN)</option>
      <option value="veikkausliiga">Veikkausliiga (FIN)</option>
    </select>
    <label for="matchday-select">Matchday:</label>
    <select id="matchday-select" onchange="renderLeague(document.getElementById('league-select').value)"></select>
    <span id="snapshot-note">ENG/ESP/GER/ITA/FRA: live snapshot · Other leagues: latest confirmed round via official/press sources</span>
  </div>
  <div id="body">
    <div id="map-wrap">
      <div id="map"></div>
      <button id="fullscreen-btn" onclick="toggleFullscreen()">⤢ Fullscreen</button>
      <div id="route-panel">
        <div id="route-header"><span id="route-title">Plan Route</span></div>
        <div id="route-hint">Open a popup → "+ Add to route".</div>
        <div id="route-stops"></div>
        <div id="route-summary"></div>
        <div id="route-actions">
          <button class="route-btn" id="clear-route-btn" onclick="clearRoute()" disabled>Clear</button>
        </div>
      </div>
    </div>
    <div id="side">
      <h2 id="fixtures-heading">Home Fixtures</h2>
      <div id="fixtures-list"></div>
      <h2 id="combos-heading">Combinable Trips (all loaded leagues)</h2>
      <div id="combos-list"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script src="js/spieltag-explorer.js"></script>
</body>
</html>
